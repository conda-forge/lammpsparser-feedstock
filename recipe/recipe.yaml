schema_version: 1

context:
  name: lammpsparser
  version: "0.0.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lammpsparser-${{ version }}.tar.gz
  sha256: 61f32cbb264c22d245e7040ca943aace658cf5af6d6f5e74621e37e1bbbec1f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - scipy
    - ase
    - numpy
    - pandas
  run:
    - python >=${{ python_min }}
    - scipy >=1.11.1,<=1.18.1
    - ase >=3.22.1,<=3.29.0
    - numpy >=1.26.0,<=2.5.3
    - pandas >=2.0.3,<=3.0.6

tests:
  - python:
      imports:
        - lammpsparser
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Parser for LAMMPS input and output files.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/lammpsparser

extra:
  recipe-maintainers:
    - jan-janssen
