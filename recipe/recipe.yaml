schema_version: 1

context:
  name: lammpsparser
  version: 0.1.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lammpsparser-${{ version }}.tar.gz
  sha256: f5c712ec22161e45fd5ce3f77bb4a8d40819baaab22fb0781df74c0555707306

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - scipy
    - ase
    - numpy
    - pandas
  run:
    - python >=${{ python_min }}
    - scipy >=1.11.1,<1.19.0
    - ase >=3.23.0,<3.30.0
    - numpy >=1.26.0,<2.6.0
    - pandas >=2.0.3,<3.2.0
tests:
  - python:
      imports:
        - lammpsparser
      python_version:
        - ${{ python_min }}
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Parser for LAMMPS input and output files.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/lammpsparser

extra:
  recipe-maintainers:
    - jan-janssen
